<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- security: see server/deploy-notes.md "Security headers" -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://rametric.com https://www.rametric.com http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Notes — Practice</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.btn{display:inline-block;padding:.45rem .9rem;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;cursor:pointer;color:var(--ink);text-decoration:none;margin:.15rem .25rem .15rem 0}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:disabled{opacity:.6;cursor:default}
.nt-mini{font-size:.8rem;padding:.2rem .55rem;border-radius:8px}
#nt-subjects{display:flex;flex-wrap:wrap;gap:.3rem;margin:.4rem 0}
.nt-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.4rem;margin-bottom:.6rem}
.nt-item{display:block;padding:.5rem .7rem;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);text-decoration:none;font-size:.93rem}
.nt-item:hover{border-color:var(--accent)}
.chip.nt-hl{color:#8a4b00;border-color:#e0b77a;background:#fdf4e3;margin-left:.35rem}
.nt-stmt{color:var(--muted);font-size:.75rem;margin-left:.4rem}
.nt-big{font-size:1.02rem;background:#eef4fc;border-left:4px solid var(--accent);padding:.5rem .7rem;border-radius:8px}
.nt-back{font-size:.88rem}
.nt-ideas{padding-left:1.3rem}
.nt-idea{margin:.45rem 0;padding:.2rem 0;border-bottom:1px solid #eef1f4}
.nt-cue{font-weight:600;margin-bottom:.2rem}
.nt-answer{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:.45rem .65rem;margin:.3rem 0}
.nt-terms dt{font-weight:600;margin-top:.45rem}
.nt-terms dd{margin:.1rem 0 .3rem 0;color:var(--ink)}
.nt-mis{list-style:none;padding:0;margin:0}
.nt-mis li{padding:.35rem 0;border-bottom:1px solid #eef1f4}
.nt-wrong{color:#a33}
.nt-right{color:#24724a}
.nt-example,.nt-prompt,.nt-mcq{border-top:1px solid #eef1f4;padding:.5rem 0}
.nt-example h4{margin:.2rem 0}
.nt-data{background:#f8fafc;border-radius:8px;padding:.4rem .6rem;font-size:.93rem}
.nt-choice{display:block;width:100%;text-align:left;padding:.45rem .65rem;margin:.25rem 0;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;cursor:pointer}
.nt-choice.correct{background:#e9f6ee;border-color:#2e8b57}
.nt-choice.wrong{background:#fdeaea;border-color:#c23b3b}
.nt-label{background:#fdf4e3;border:1px solid #f0d9a8;border-radius:8px;padding:.4rem .6rem;font-size:.88rem}
.nt-err{color:#c23b3b}
.nt-foot{margin-top:1rem}
.nt-res{padding-left:1.2rem;margin:.3rem 0}
.nt-res li{margin:.2rem 0}
.nt-res-form{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.nt-res-form input{font:inherit;padding:.35rem .5rem;border:1px solid var(--line);border-radius:8px;flex:1 1 180px}
.nt-ai-modes{display:flex;flex-wrap:wrap;gap:.3rem;margin:.3rem 0}
.nt-ai-pref{display:inline-block;margin:.35rem .5rem .1rem 0;font-size:.9rem}
.nt-ai-pref select{font:inherit;padding:.2rem .4rem;border:1px solid var(--line);border-radius:8px;background:#fff}
#nt-ai-again[hidden]{display:none} /* .btn sets display, which would defeat the hidden attribute */
.nt-ai-toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:#1c3d5a;color:#fff;padding:.6rem 1rem;border-radius:10px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.2);font-size:.93rem}
@media (max-width:600px){main{padding:.8rem .6rem 2rem}.card{padding:.8rem .8rem}.nt-list{grid-template-columns:1fr}}
@media print{.btn{display:none}.nt-answer[hidden]{display:block}}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="brand">Practice</a>
  <a href="notes.html" class="active">Notes</a>
  <a href="quiz.html">Quiz</a>
  <a href="cards.html">Cards</a>
  <a href="coursework.html">Coursework</a>
  <a href="author.html">Upload</a>
  <span id="auth-slot"></span><a href="../index.html" style="margin-left:auto">← Study site</a>
</nav>
<main>
  <h2>Topic notes</h2>
  <p class="muted">Organised by the official topic codes. Recall first: try each cue before revealing the answer, then use the quiz and flashcard links for this topic.</p>
  <div id="nt-subjects"></div>
  <section class="card" id="nt-index"></section>
  <div id="nt-note" hidden></div>
</main>
<script src="../assets/store.js?v=7"></script>
<script src="../assets/profile.js?v=1"></script>
<script src="../assets/ai-prompt.js?v=4"></script>
<script src="../assets/notes.js?v=4"></script>
<script src="../assets/auth.js?v=10"></script>
</body>
</html>

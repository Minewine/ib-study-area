# GitHub Actions workflow — the live copy is .github/workflows/test.yml; this
# tools/ file is the source-of-truth template. Keep both in sync.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: PHP (runner image ships php-cli)
        run: php -v
      - name: Python tests (incl. PHP API tests against php -S)
        run: uv run pytest -q
      - name: JavaScript tests
        run: node --test tests/js/*.test.js
      - name: Syntax checks
        run: |
          for f in assets/*.js; do node --check "$f"; done
          for f in server/*.php tools/*.php; do php -l "$f"; done
      - name: Content validator
        run: python3 -I tools/validate_content.py
